# dsh-atomgit-panel bundle patch.
#
# One row, host + client faces: the Host half registers the loopback-only
# `/api/dsh-atomgit-panel/**` route and the `atomgit_tracker` tool; the
# `dsh.client` declaration in package.json makes the browser half load in the
# Web GUI, where it contributes the right-sidebar tab type, its body and chip,
# and a conversation-header entry.
- insert:
    - id: atomgit-panel
      name: 'dsh-atomgit-panel'
